      local_path: dataset/aime2024.jsonl
    aime2025:
      path: test-time-compute/aime_2025
      split: train
      local_path: dataset/aime2025.jsonl
    aime2026:
      path: 96kevinli29/aime2026-en
      split: train
      local_path: dataset/aime2026.jsonl
    arc_c:
      path: allenai/ai2_arc
      name: ARC-Challenge
      split: test
      local_path: null
    obqa:
      path: allenai/openbookqa
